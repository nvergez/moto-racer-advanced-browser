# Moto Racer Advance: gbarecomp game config (scaffold).
#
# One file read by two parsers: gba_recompile (toml++; [program], [identity]
# and the [[...]] arrays) and the gbarecomp runtime (a line-based reader for
# [game], [bios], [rom], [save], [video], [audio]; see
# docs/research/gbarecomp-integration.md, section 2).
#
# Every "TBD" below depends on the ROM, which nobody has dumped yet. The build
# scripts refuse to run while any "TBD" value is left. Fill them in from the
# owner's dump (docs/toolchain.md, "Filling in game.toml"); never copy values
# from the internet. The runtime treats "TBD" as empty.
#
# Rules for later edits: no tool ever writes this file. Every [[extra_func]],
# [[jump_table]], [[code_copy]], [[data_range]] entry is reviewed by a human
# and carries a `note` with its evidence (ROM SHA-1 and how it was found).

[game]
name = "Moto Racer Advance"
short_name = "moto_racer_advance"

[program]
# TODO(rom): region, from the header and the cartridge label.
name = "TBD"
# TODO(rom): 4-character game code, from `gba_scan` (game_code=). The
# game-facts research (PR #4) lists A9ME (USA) and A9MP (Europe).
id = "TBD"
load_address = 0x08000000
# TODO(rom): ROM size in bytes as hex, e.g. 0x00400000 for 4 MiB.
# `stat -f %z roms/moto-racer-advance.gba`; it must match the file exactly.
size = "TBD"
# The header branch at 0x08000000, as MKSC and MMZ use.
entry_pc = 0x08000000
# Evidence-only discovery: no heuristic harvest of code pointers from literal
# pools (both reference games turn it off). An A/B run with it on is a
# playbook option, into a separate output directory.
speculative_literal_harvest = false
codegen_shards = 16

[identity]
# TODO(rom): `shasum -a 1 roms/moto-racer-advance.gba`. gba_recompile aborts
# when the ROM does not match. Keep it equal to [rom].sha1 below. Compare it
# with the known dumps in the game-facts research (PR #4) before trusting it.
sha1 = "TBD"
# TODO(rom): `md5 -q roms/moto-racer-advance.gba`.
md5 = "TBD"

[bios]
# Paths are relative to this file. The dump never enters git (bios/ is ignored).
path = "bios/gba_bios.bin"
sha1 = "300c20df6731a33952ded8c436f7f186d25d3492"
hle = false

[rom]
path = "roms/moto-racer-advance.gba"
# TODO(rom): same value as [identity].sha1.
sha1 = "TBD"

# [save] is left out until the save type is confirmed on the dump. Without it
# the runtime detects the type from the save library ID string that `gba_scan`
# also reports (save_type=). The game-facts research (PR #4) expects 32 KiB
# SRAM with the ID string SRAM_F_V102, which that scan does not recognize, so
# this game will most likely need type = "sram" here (unverified until the
# owner's dump is checked with a byte search and in mGBA).
# [save]
# type = "TBD"   # sram | eeprom | flash512 | flash1m
# size = "TBD"   # bytes: sram 32768, eeprom 512 or 8192, flash512 65536, flash1m 131072
