# Moto Racer Advance: gbarecomp game config.
#
# One file read by two parsers: gba_recompile (toml++; [program], [identity]
# and the [[...]] arrays) and the gbarecomp runtime (a line-based reader for
# [game], [bios], [rom], [save], [video], [audio]; see
# docs/research/gbarecomp-integration.md, section 2, in PR #2). The runtime drops
# everything after '#' on a line, so no value may contain '#'.
#
# Pinned ROM revision: "Moto Racer Advance (Europe) (En,Fr,De,Es,It)",
# SHA-1 b91bad8ee04652d71e0610f8d1a5deaebd4c1fd0. Every value below was read
# from the owner's dump on 2026-10-10 (commands in docs/toolchain.md, "The
# game config") and matches the No-Intro entry recorded in the game-facts
# research (PR #4): SHA-1, MD5, CRC32 8CB19DA0, 4194304 bytes, serial A9MP.
# The USA cartridge (A9ME) is a different binary: this config refuses it.
#
# Rules for later edits: no tool ever writes this file. Every [[extra_func]],
# [[jump_table]], [[code_copy]], [[data_range]] entry is reviewed by a human
# and carries a `note` with its evidence (ROM SHA-1 and how it was found).
# The build scripts refuse to run while any value is still "TBD".

[game]
name = "Moto Racer Advance"
short_name = "moto_racer_advance"

[program]
name = "Moto Racer Advance (Europe) (En,Fr,De,Es,It)"
# Header game code (gba_scan: game_code=A9MP, title MOTORACERADV, maker 41).
id = "A9MP"
load_address = 0x08000000
# 4194304 bytes (stat -f %z; gba_scan: rom_size=0x400000).
size = 0x00400000
# The header branch at 0x08000000 (gba_scan: entry_target=0x080000c0).
entry_pc = 0x08000000
# Evidence-only discovery: no heuristic harvest of code pointers from literal
# pools (both reference games turn it off). An A/B run with it on is a
# playbook option, into a separate output directory.
speculative_literal_harvest = false
codegen_shards = 16

[identity]
# shasum -a 1 / md5 -q of the dump. gba_recompile aborts on any other ROM.
# Keep sha1 equal to [rom].sha1 below.
sha1 = "b91bad8ee04652d71e0610f8d1a5deaebd4c1fd0"
md5 = "d3b2ab65c92e18df21788c4b30128041"

[bios]
# Paths are relative to this file. The dump never enters git (bios/ is ignored).
path = "bios/gba_bios.bin"
sha1 = "300c20df6731a33952ded8c436f7f186d25d3492"
hle = false
# Keep the real boot intro: with skip_intro, gbarecomp leaves the BG2/BG3
# affine matrices at zero, and this game draws its races in mode 1 affine
# (docs/toolchain.md, known issue 6).

[rom]
path = "roms/moto-racer-advance.gba"
sha1 = "b91bad8ee04652d71e0610f8d1a5deaebd4c1fd0"

[save]
# 32 KiB battery-backed SRAM. The ROM carries Nintendo's save library ID
# string "SRAM_F_V102" (at ROM offset 0x1C6D0 in this dump, found with a byte
# search), and the game reads the save area byte by byte during boot (mGBA
# 0.10.5 read watch on 0x0E000000-0x0E007FFF, no input: at frame 596, Thumb
# code at EWRAM 0x0203D7EA makes 3,280 one-byte reads, 0x0E000000 to
# 0x0E000CCF). gbarecomp's detector only knows the "SRAM_V" prefix, so
# gba_scan reports save_type=unknown: without this section the game would
# find no save chip. 32768 is the only size gbarecomp accepts for sram.
type = "sram"
size = 32768

# TODO(phase1): IWRAM code images. The game copies ARM code from ROM to IWRAM
# 0x03000000 and runs most of a race from there (**unverified** here; it is
# a Phase 1 research lead). Two different images share that base address:
# the front end's (ROM 0x081596FC, 0x834 bytes) and the race program's (ROM
# 0x083F6820, 0x49C4 bytes). How the bounds were found, in this dump:
#   - literal pools: 0x080002C8, 0x080002CC, 0x080002D0 hold 0x081596FC,
#     0x03000000, 0x834; 0x0815A070, 0x0815A074, 0x0815A078 hold
#     0x083F6820, 0x03000000, 0x49C4 (read from the ROM file);
#   - mGBA 0.10.5 read/write watches, no input: at frames 279-280 the loop
#     at 0x08159FFC-0x0815A008 copies 0x49C4 bytes from 0x083F6820 to
#     0x03000000; at frame 293 the loop at 0x08000260-0x08000264 copies
#     0x834 bytes from 0x081596FC over the start of it.
# [[code_copy]] maps one runtime range to one source, so declaring both
# needs a decision on how recompiled dispatch tells the overlays apart.
# Until then they are left out, and IWRAM code reaches gbarecomp's
# interpreter and self-heal path (docs/toolchain.md, "First real-ROM smoke
# test").
#
# TODO(phase1): the race program is a second, separately linked program
# (**unverified** here; a Phase 1 research lead) entered through 0x08159F30,
# the first byte after the front end's image (0x081596FC + 0x834). In the
# same mGBA run, 0x08159F30 first executes at frame 271 and calls the
# routine that does the copy above. Seed it, and anything else found only
# at run time, as reviewed [[extra_func]] entries from the runtime's miss
# reports.
#
# TODO(phase1): [[data_range]] entries for large data and compressed assets,
# if discovery ever decodes them as code.
