mode = "arm"
note = "ROM SHA-1 b91bad8ee04652d71e0610f8d1a5deaebd4c1fd0. Case slot 0 of 14 of the armcc switch at 0x080003FC (addls pc, pc, r1, lsl 2, bounded by cmp r1, 13 at 0x080003F4): the dispatcher jumps here for index 0, and the slot is b 0x0800043C. The finder does not follow the addls. Found by tools/seeds/find_switch_tables.py, which checked that all 14 slots are b instructions."

