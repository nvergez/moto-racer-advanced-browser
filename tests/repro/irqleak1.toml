# gba_recompile and runtime config for the synthetic repro ROM irqleak1
# (tests/repro/make_rom.py irqleak1; no Nintendo data inside). It reproduces
# the IRQ call-return leak that patches/gbarecomp/0003 fixes: see
# tests/repro/README.md. scripts/repro-test.sh generates the ROM, checks its
# SHA-1 against [identity] below, recompiles it with this file and runs it.
[game]
name = "IRQ leak repro 1"
short_name = "irqleak1"

[program]
name = "irqleak1"
id = "ZZZZ"                     # header game code written by make_rom.py
load_address = 0x08000000
size = 0x00001000               # 4096 bytes
entry_pc = 0x08000000
speculative_literal_harvest = false
# Every instruction of an emitted function gets a static entry, so the
# handler's return address 0x08000188 (after `bl 0x08000140`) has one. That
# is where the IRQ-continuation bridge for F stops.
static_resume_all = true

[identity]
sha1 = "5ce18c7c345bcf14a1650d2d628e93b7e2159c6a"

[bios]
# The header logo is zero, so the BIOS intro, which checks it, must not run.
skip_intro = true

[[extra_func]]
addr = 0x08000180
mode = "arm"
note = "VBlank IRQ handler. Its address appears only in the literal at 0x08000104, which the start-up code stores at 0x03007FFC (make_rom.py)"
