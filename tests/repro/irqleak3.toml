# gba_recompile and runtime config for the synthetic repro ROM irqleak3
# (tests/repro/make_rom.py irqleak3; no Nintendo data inside): irqleak1's code,
# run with a function-entry hook at F (tests/repro/irqleak3_hooks.cpp, built
# into repro_irqleak3). It checks the second part of patches/gbarecomp/0003,
# which the first part does not cover: see tests/repro/README.md.
# scripts/repro-test.sh generates the ROM, checks its SHA-1 against
# [identity] below, recompiles it with this file and runs it.
[game]
name = "IRQ leak repro 3"
short_name = "irqleak3"

[program]
name = "irqleak3"
id = "ZZZX"                     # header game code written by make_rom.py
load_address = 0x08000000
size = 0x00001000               # 4096 bytes
entry_pc = 0x08000000
speculative_literal_harvest = false
# As in irqleak1: the handler's return address 0x08000188 (after
# `bl 0x08000140`) gets a static entry, so the BL site continues natively
# once the bridge for F returns there.
static_resume_all = true

[identity]
sha1 = "cc29307835a67e64bb61af3bbf877a8b50858bb4"

[bios]
# The header logo is zero, so the BIOS intro, which checks it, must not run.
skip_intro = true

[[extra_func]]
addr = 0x08000180
mode = "arm"
note = "VBlank IRQ handler. Its address appears only in the literal at 0x08000104, which the start-up code stores at 0x03007FFC (make_rom.py)"
