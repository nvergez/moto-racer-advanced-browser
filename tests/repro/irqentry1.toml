# gba_recompile and runtime config for the synthetic repro ROM irqentry1
# (tests/repro/make_rom.py irqentry1; no Nintendo data inside). It times a
# loop with and without one timer IRQ inside it, which shows the cycles of
# IRQ entry that patches/gbarecomp/0012 adds: see tests/repro/README.md.
# scripts/repro-test.sh generates the ROM, checks its SHA-1 against
# [identity] below, recompiles it with this file and runs it.
[game]
name = "IRQ entry repro 1"
short_name = "irqentry1"

[program]
name = "irqentry1"
id = "ZZZU"                     # header game code written by make_rom.py
load_address = 0x08000000
size = 0x00001000               # 4096 bytes
entry_pc = 0x08000000
speculative_literal_harvest = false

[identity]
sha1 = "6c9de927e42a1b27033520bf868cbf0379201b1d"

[bios]
# The header logo is zero, so the BIOS intro, which checks it, must not run.
skip_intro = true

[[extra_func]]
addr = 0x08000180
mode = "arm"
note = "Timer 1 IRQ handler. Its address appears only in the literal at 0x0800014C, which the start-up code stores at 0x03007FFC (make_rom.py, IRQENTRY1)"
