# Allowlist of route boot_to_race for comparison 2 (gbarecomp against mGBA),
# read by tools/difftest/compare.py through scripts/replay-test.sh
# boot_to_race --against mgba. Format: tools/difftest/README.md. Every entry
# names the frames, the checks it covers, its cause and where the evidence is;
# fixed_by names the task expected to make it unnecessary.
#
# Frames are harness frames on the pinned ROM (SHA-1
# b91bad8ee04652d71e0610f8d1a5deaebd4c1fd0) and BIOS (SHA-1
# 300c20df6731a33952ded8c436f7f186d25d3492), with gbarecomp's interpreter
# (GBARECOMP_FORCE_INTERP=1) as the gbarecomp side, measured on gbarecomp
# 5e89943 with patches 0001-0006 (docs/research/phase2-comparator.md,
# section 3). An entry covers a check on a frame; the first matching entry
# counts the hit.
#
# The front-end entries (frames 1-3285) name exactly the frames where their
# check differs, one entry per check, so a later change that makes another
# frame differ there fails: compare.py reports an entry that covers frames it
# does not hit as PARTLY USED. The race entry is the one exception: the race
# is out of lockstep with mGBA on this gbarecomp and every check differs on
# most of its frames, so it covers them all until P2-21 removes it.

schema = 1
route = "boot_to_race"
against = "mgba"

[[allow]]
id = "affine-reset-values"
frames = "1"
checks = ["layer1"]
cause = "Before the BIOS first writes them, BG2PA, BG2PD, BG3PA and BG3PD read 0 in gbarecomp and 0x0100 in mGBA: line 0 of frame 1 only. Which reset value the hardware has is unverified."
ref = "docs/research/phase2-diagnosis.md section 7.2; docs/research/phase2-comparator.md section 3.1"

[[allow]]
id = "obj-1st-target"
frames = "222-269, 2453-2481, 3258-3289"
checks = ["layer2"]
cause = "gbarecomp applies a color effect to an OBJ pixel only when the OBJ is semi-transparent and ignores BLDCNT bit 4 (OBJ 1st target), so normal OBJs stay unfaded: the BIOS logo (BLDCNT 0x3FBF, BLDY 2 to 16) and the game's fades from the title and from the last menu (BLDCNT 0x00FF). The line state is equal on these frames. Frames 220-221 (BLDY 1) differ by one step at most and pass."
ref = "docs/research/phase2-diagnosis.md section 5.1; docs/research/phase2-replay.md section 3"
fixed_by = "P2-08"

[[allow]]
id = "obj-priority-over-affine-bg"
frames = "2968-2973"
checks = ["layer2"]
cause = "Only where OBJ 0 (priority 2) and OBJ 6 (priority 0, transparent at those pixels) overlap BG2 (affine, priority 1): mGBA draws OBJ 0 in front of BG2, gbarecomp behind it. The line state is equal on these frames (but line 25 of 2972, see mid-frame-write-timing). Which engine matches hardware is unverified."
ref = "docs/research/phase2-replay.md section 3; docs/research/phase2-comparator.md section 3.1"

[[allow]]
id = "mid-frame-write-timing"
frames = "294, 296, 607, 610, 1031, 1393-1395, 1864, 1873, 2149, 2157, 2165, 2188, 2482-2483, 2490, 2498, 2506, 2514, 2522, 2524, 2733, 2965, 2967, 2972, 2997, 3002, 3010-3011, 3014, 3018, 3027-3029, 3031, 3033, 3037, 3039, 3041-3045, 3052-3053, 3154, 3183, 3188, 3196, 3225, 3232, 3236, 3240, 3254"
checks = ["layer1"]
cause = "A write to a video register, the palette, OAM or VRAM lands on another line than in mGBA: the per-line state differs on a band of lines and is equal again later in the frame (2188: from the next frame on, its DMA3 spans the VBlank start). CPU, DMA or IRQ timing, the same profile on every gbarecomp backend. Pixels: see mid-frame-write-pixels."
ref = "docs/research/phase2-diagnosis.md section 5.4; docs/research/phase2-comparator.md section 3.1"

[[allow]]
id = "mid-frame-write-pixels"
frames = "610, 1031, 2188, 2482, 2498"
checks = ["layer2"]
cause = "The frames of mid-frame-write-timing whose pixels differ beyond one step: on each, the first such pixel is on a line whose state differs (lines 30, 80, 133, 110 and 30). The other frames of that entry have equal pixels or pass layer 2 (607, 1393-1395, 2483), but 2972, whose pixels obj-priority-over-affine-bg covers."
ref = "docs/research/phase2-diagnosis.md section 5.4; docs/research/phase2-comparator.md section 3.1"

[[allow]]
id = "ram-snapshot-timing-ewram"
frames = "294-295, 596-606, 608-609, 2155, 2482"
checks = ["ram:ewram"]
cause = "A CPU copy or decompression into EWRAM runs across the VBlank start, where the record is taken, at a slightly different point in the two engines: on each frame one 4 KiB block differs, a different block every frame, and EWRAM is equal again the next frame."
ref = "docs/research/phase2-comparator.md section 3.2"

[[allow]]
id = "ram-snapshot-timing-iwram"
frames = "607"
checks = ["ram:iwram"]
cause = "The same on IWRAM, once: 0x03001C00-0x03001FFF differs on frame 607 and is equal again the next frame."
ref = "docs/research/phase2-comparator.md section 3.2"

