[[allow]]
id = "race-starts-one-frame-late"
frames = "3286-4400"
checks = ["layer1", "layer2", "ram:*"]
cause = "gbarecomp's GamePak prefetch model never resets on a branch, so the race program's start-up loop is 18% slower: EWRAM differs from 3286 while it clears .bss, the race image arrives at 3291 instead of 3290, and with the inputs on the same frames the race leaves lockstep with mGBA (no IRQ entry cycles in gbarecomp also moves VCOUNT-fed random draws). No frame map realigns it: with a +1 map EWRAM still differs from 3293. Deliberately wider than the frames that differ (the report lists the others): with the race out of lockstep, nothing on these frames is compared until P2-21 removes this entry."
ref = "docs/research/phase2-race-lockstep.md sections 2-4; docs/research/phase2-comparator.md section 3.3"
fixed_by = "P2-21"
