[routes.cup]
script = "tools/analysis/input/cup.txt"
frames = 63542
sram = "written"
save_sha1 = "f6743468e8ecd41f21a5e3d58cdc83ab4c9e2128"
note = "Championship is locked on a fresh save; the script enters the game's unlock code on the main menu (docs/research/phase2-routes.md). Open-loop: 8th place in every race."

[[routes.cup.checkpoints]]
event = "main_menu"
when = "main_menu == 1"
frame = 2524
before = 2715                # hold L: unlock code

[[routes.cup.checkpoints]]
event = "unlocked"
when = "unlocks == ALL_UNLOCKED"
frame = 2761
before = 2843                # A: solo (its menu is built from the unlock bits)

[[routes.cup.checkpoints]]
event = "race1_display"
when = "image == RACE and DISPCNT == RACE_DISPLAY and track == KENYA and cross_rookie_races == 0"
frame = 3593
before = 3701                # hold A

[[routes.cup.checkpoints]]
event = "race1_result"
when = "image == FRONTEND and cross_rookie_points >= 1"
frame = 22404
before = 24201               # release A
expect = { cross_rookie_points = 1 }

[[routes.cup.checkpoints]]
event = "race1_recorded"
when = "cross_rookie_races == 1"
frame = 24532
before = 24831               # A: best lap -> best race

[[routes.cup.checkpoints]]
event = "race2_display"
when = "image == RACE and DISPCNT == RACE_DISPLAY and track == TEXAS and cross_rookie_races == 1"
frame = 26079
before = 26191               # hold A

[[routes.cup.checkpoints]]
event = "race2_result"
when = "image == FRONTEND and cross_rookie_points >= 2"
frame = 42308
before = 44101               # release A
expect = { cross_rookie_points = 2 }

[[routes.cup.checkpoints]]
event = "race2_recorded"
when = "cross_rookie_races == 2"
frame = 44432
before = 44731               # A: best lap -> best race

[[routes.cup.checkpoints]]
event = "race3_display"
when = "image == RACE and DISPCNT == RACE_DISPLAY and track == FRANCE and cross_rookie_races == 2"
frame = 45980
before = 46091               # hold A

[[routes.cup.checkpoints]]
event = "race3_result"
when = "image == FRONTEND and cross_rookie_points >= 3"
frame = 59864
before = 61701               # release A
expect = { cross_rookie_points = 3 }

[[routes.cup.checkpoints]]
