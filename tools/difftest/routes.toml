# Route manifest (docs/phase2-plan.md, P2-04).
#
# Every route starts from boot, with a fresh empty save or with the save
# another route writes (start_save), never from a savestate. Read and checked
# by tools/difftest/routes.py; run on mGBA by tools/difftest/mgba-routes.sh.
#
# All frames are mGBA harness frames (tools/analysis/README.md, "Frame
# numbering") on the pinned ROM and BIOS below, with the harness's real BIOS
# boot. Addresses and values in this file were found on that ROM; evidence is
# in each field's note and in docs/research/phase2-routes.md.
#
# Route keys:
#   script      harness input script
#   frames      run length (the script ends there; the runner passes --frames)
#   start_save  "" for a fresh empty save, or the name of an earlier route
#               whose final save the run starts from (copied before each run,
#               because the harness writes the run's save back to the file)
#   sram        "none" if the route never writes the save, "written" if it does
#   save_sha1   SHA-1 of the route's final 32 KiB save in mGBA (a fresh save
#               that is never written stays all 0xFF)
#   checkpoints in order; each one is an event that both engines' per-frame
#               captures can show:
#     event   name
#     when    predicate on one frame's fields: FIELD OP VALUE [and ...], with
#             OP one of == != >= <= > < and VALUE a number or a name from
#             [values]
#     frame   the frame where it first holds in mGBA
#     before  the first frame played with the first later input that relies
#             on it: the frame where trace.tsv's keys column changes, which is
#             one after the script's "until N" or "wait" frame (the input
#             after "until 2714" lands on frame 2715). Omitted: the end of the
#             route. A run follows the route when every event occurs, in
#             order, on a frame before its "before" frame.
#     expect  field values at the event frame in mGBA that are results, not
#             route following (finishing positions, points): compared with
#             mGBA (P2-19), not required for a run to follow the route
#
# Post-race inputs leave slack for engines whose races end on another frame
# (docs/research/phase2-diagnosis.md section 6): the "slack" column that
# routes.py prints is how many frames later an event may come.

schema = 1
rom_sha1 = "b91bad8ee04652d71e0610f8d1a5deaebd4c1fd0"
bios_sha1 = "300c20df6731a33952ded8c436f7f186d25d3492"

[values]
FRONTEND = 0xE92D4FF3        # first word of the front-end IWRAM image
RACE = 0xE3A00640            # first word of the race-program IWRAM image
RACE_DISPLAY = 0x1741        # DISPCNT while a race is on screen
ALL_UNLOCKED = 0x0FFF        # unlocks after the unlock code
FRENCH = 1                   # language
KENYA = 0                    # track ids
TEXAS = 1
FRANCE = 2
CALIFORNIA = 6
MOSCOW = 12

# Per-frame fields, sampled at VBlank start. "io" names a trace.tsv column of
# the harness; "addr"/"size" a little-endian memory read (--trace-mem column
# mem_AAAAAAAA). A capture checked against a route needs the fields its
# checkpoints use; mgba-routes.sh captures all of them.

[fields.DISPCNT]
io = "DISPCNT"
note = "Display control. 0x1741 while a race is displayed (Phase 1 section 2); 0 while the race program loads."

[fields.image]
addr = 0x03000000
size = 4
note = "First word of the resident IWRAM code image: 0xE92D4FF3 front end, 0xE3A00640 race program (diagnosis section 3.1; read from ROM 0x081596FC and 0x083F6820)."

[fields.main_menu]
addr = 0x0203CE3C
size = 4
note = "1 while the main menu runs: set at 0x08005664 on entry to the main-menu function 0x08005658, cleared at 0x08005948 when it returns; the key reader at 0x08002370 accepts the unlock code only while it is 1. Harness: 2524-2732 on boot_to_race."

[fields.language]
addr = 0x0203F017
size = 1
note = "Language in the save block (save offset 0x17, Phase 1 section 1): 0 English, 1 Francais. Written at 0x08009B70 when the Options language cursor moves (options_save, frame 3049)."

[fields.multiplayer]
addr = 0x0203F01B
size = 1
note = "Save-block byte 0x1B: 1 while the multiplayer screens run (set at 0x08001400, cleared at 0x08001758; multiplayer_lobby frames 2773-3261). The Solo-menu builder reads it at 0x08000E20. Meaning beyond that is unverified."

[fields.unlocks]
addr = 0x0203F02A
size = 2
note = "Save-block halfword 0x2A: championship and league unlock bits. Bits 0/3/6 open the Cross/GP/Traffic championship, bits 3d+1 and 3d+2 the second and third cup of discipline d, bit 9 the league (Solo menu 0x08000E18-0x08000E40, discipline menu 0x08000F50-0x08000F74, cup menu 0x0800098C-0x080009A4). 0 on a fresh save; the unlock code (code 0 of the table at 0x02000100) ORs in 0x0FFF at 0x08000458-0x08000464."

[fields.track]
addr = 0x0203F00A
size = 1
note = "Save-block byte 0x0A: id of the selected track, 6 per discipline (0 Kenya, 1 Texas, 2 France, 6 California, 12 Moscow). Written by the single-race track select at 0x08005F20 and by the championship from its cup table at 0x08001160 and 0x08000AB8; the front end reads it at 0x0800212C just before handing over to the race program (race_gp, frame 3328)."

[fields.cross_rookie_races]
addr = 0x0203FC50
size = 1
note = "Save-block byte 0xC50: races completed in the Cross Rookie championship (cup record k=0 at 0xC50+10k, compared with the cup's race count at 0x080010A4 and 0x0800094C). Incremented when the standings screen is left after each race (cup: 24532, 44432, 62032)."

[fields.cross_rookie_best]
addr = 0x0203FC51
size = 1
note = "Save-block byte 0xC51: 8 until the Cross Rookie cup is completed, then the player's final standing, 0-based (7 = 8th of 8; the cup's final standings screen shows the player last). The 0-based reading is likely, not verified."

[fields.cross_rookie_points]
addr = 0x0203FC52
size = 1
note = "Save-block byte 0xC52: the player's championship points in Cross Rookie, written when the front end takes over after each race; 0xC53-0xC59 hold CP1-CP7. Matches the race-complete screen (8 points for 1st down to 1 for 8th): cup race 1 gives the player +1 (8th) and 1, 3, 2, 5, 4, 8, 6, 7 for PLR and CP1-CP7."

